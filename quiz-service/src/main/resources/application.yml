dotenv:
  directory: ../

server:
  port: 8083

spring:
  application:
    name: quiz-service

  data:
    mongodb:
      uri: ${MONGODB_QUIZ_URI}

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings