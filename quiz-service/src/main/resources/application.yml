dotenv:
  directory: ../

server:
  port: 8083

spring:
  application:
    name: quiz-service

  data:
    mongodb:
      uri: ${MONGODB_QUIZ_URI}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8181/realms/lms/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings