server:
  port: 8083

spring:
  application:
    name: quiz-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/lms_quiz_db

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/lms

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings